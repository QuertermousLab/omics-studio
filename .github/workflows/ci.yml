name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  genome-canvas:
    runs-on: ubuntu-24.04  # Python 3.8 (ZORAN runs 3.8) is not on ubuntu-latest (26.04)
    defaults:
      run:
        working-directory: genome-canvas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: genome-canvas/package-lock.json
      - name: Install tabix (LocusCompare tests)
        run: sudo apt-get update && sudo apt-get install -y tabix
      - run: npm ci
      - run: npm test

  great:
    runs-on: ubuntu-24.04  # Python 3.8 (ZORAN runs 3.8) is not on ubuntu-latest (26.04)
    defaults:
      run:
        working-directory: great
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - run: python -B -m unittest discover -s tests

  auth:
    runs-on: ubuntu-24.04  # Python 3.8 (ZORAN runs 3.8) is not on ubuntu-latest (26.04)
    defaults:
      run:
        working-directory: auth
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -B -m unittest discover -s tests

  workbench:
    runs-on: ubuntu-24.04  # Python 3.8 (ZORAN runs 3.8) is not on ubuntu-latest (26.04)
    defaults:
      run:
        working-directory: workbench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - name: Omics Workbench (job scripts, permissions, passwords) and the Python gateway
        run: python -B -m unittest discover -s tests

  alphagenome:
    runs-on: ubuntu-24.04  # Python 3.8 (ZORAN runs 3.8) is not on ubuntu-latest (26.04)
    defaults:
      run:
        working-directory: alphagenome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - name: AlphaGenome control (start / stop, tunnel, idle stop) against a fake GPU server
        run: python -B -m unittest discover -s tests

  omics-canvas:
    runs-on: ubuntu-24.04  # Python 3.8 (ZORAN runs 3.8) is not on ubuntu-latest (26.04)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile the hub backend and converters
        run: python -m py_compile hub/*.py hub/converters/*.py
      - name: Test the expression exports, plots and converters
        run: |
          pip install numpy pandas scipy pyarrow
          python -m unittest discover hub/tests
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: hub/web/package-lock.json
      - name: Build and type-check the web pages
        working-directory: hub/web
        run: |
          npm ci
          npm run build
          npx tsc -p .

  omics-workbench-macos:
    # the Mac app only compiles on macOS: build it on every push (the other Mac apps build on mac-ui-* branches and tags)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Build Omics Workbench.app
        working-directory: desktop/OmicsWorkbenchDesktop
        run: ./build.sh dist/ci
      - name: Check the bundle
        working-directory: desktop/OmicsWorkbenchDesktop
        shell: bash
        run: |
          app="dist/ci/Omics Workbench.app"
          test "$(lipo -archs "${app}/Contents/MacOS/OmicsWorkbenchDesktop")" = "arm64"
          test -f "${app}/Contents/Resources/OmicsWorkbench.icns"
          test -f "${app}/Contents/Resources/Fonts/Manrope-Variable.ttf"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "${app}/Contents/Info.plist")" = "1.0.1"
          codesign --verify --deep --strict "${app}"
      - name: Keep the app (to add it to a release by hand when needed)
        uses: actions/upload-artifact@v4
        with:
          name: OmicsWorkbenchDesktop-macOS-arm64
          path: desktop/OmicsWorkbenchDesktop/dist/ci/OmicsWorkbenchDesktop-macOS.zip
          retention-days: 14
