name: macOS UI preview

# Builds the native apps on macOS and captures their windows in the light and dark themes, so interface
# changes can be reviewed without a local Mac. Genome Canvas uses its bundled local backend; Omics Canvas and
# Omics Workbench cannot reach the lab server from GitHub and show their "server unavailable" state (with example
# datasets / jobs in the sidebar).
on:
  workflow_dispatch:
  push:
    branches:
      - "mac-ui-*"

permissions:
  contents: read

jobs:
  preview:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: genome-canvas
            dir: genome-canvas/macos/GenomeCanvasDesktop
            bundle: Genome Canvas.app
            binary: GenomeCanvasDesktop
            snapshot: GENOME_CANVAS_SNAPSHOT_DIR
          - app: omics-canvas
            dir: desktop/OmicsCanvasDesktop
            bundle: Omics Canvas.app
            binary: OmicsCanvasDesktop
            snapshot: OMICS_CANVAS_SNAPSHOT_DIR
          - app: omics-workbench
            dir: desktop/OmicsWorkbenchDesktop
            bundle: Omics Workbench.app
            binary: OmicsWorkbenchDesktop
            snapshot: OMICS_WORKBENCH_SNAPSHOT_DIR
    steps:
      - uses: actions/checkout@v6
      - name: Build native app
        working-directory: ${{ matrix.dir }}
        run: ./build.sh dist/preview
      - name: Capture light and dark windows
        working-directory: ${{ matrix.dir }}
        shell: bash
        run: |
          shots="${RUNNER_TEMP}/shots"
          mkdir -p "${shots}"
          # Omics Canvas: example datasets in the sidebar; Omics Workbench: example jobs (CI cannot reach the lab server)
          env "${{ matrix.snapshot }}=${shots}" OMICS_CANVAS_SNAPSHOT_DATASETS="${PWD}/preview/sidebar-datasets.json" \
            OMICS_WORKBENCH_SNAPSHOT_JOBS="${PWD}/preview/sidebar-jobs.json" \
            "dist/preview/${{ matrix.bundle }}/Contents/MacOS/${{ matrix.binary }}" > "${shots}/app.log" 2>&1 &
          for attempt in $(seq 1 60); do
            [[ -f "${shots}/window-dark.png" ]] && break
            sleep 2
          done
          cp "${HOME}/Library/Application Support/Genome Canvas/local-backend.log" "${shots}/" 2>/dev/null || true
          ls -la "${shots}"
          test -f "${shots}/window-light.png"
          test -f "${shots}/window-dark.png"
      - name: Check the Omics Workbench job notifications
        if: matrix.app == 'omics-workbench'
        shell: bash
        run: |
          # preview/sidebar-jobs.json: two jobs end between its "baseline" and "jobs" lists (one done, one failed);
          # the app logs the notifications it would show
          log="${RUNNER_TEMP}/shots/app.log"
          grep "notification:" "${log}"
          test "$(grep -c 'notification:' "${log}")" -eq 2
          grep -q "notification: Finished: RNA-seq · example time course" "${log}"
          grep -q "notification: Failed: Cell Ranger · example PBMC" "${log}"
          test -f "${{ matrix.dir }}/dist/preview/${{ matrix.bundle }}/Contents/Resources/OmicsWorkbench.icns"
      - name: Capture Omics Workbench connected to a test server (the page must follow the window's theme)
        if: matrix.app == 'omics-workbench'
        working-directory: ${{ matrix.dir }}
        shell: bash
        run: |
          # a test server on the runner (sign-in off: no OMICS_CANVAS_AUTH): the Workbench service, Genome Canvas for
          # workspaces, the hub's built pages served as plain files, and the Python gateway in front
          R="${GITHUB_WORKSPACE}"
          shots="${RUNNER_TEMP}/shots/server"
          mkdir -p "${shots}" "${RUNNER_TEMP}/gc-state" "${RUNNER_TEMP}/wb-state"
          (cd "${R}/hub/web" && npm ci --no-audit --no-fund > "${shots}/npm.log" 2>&1 && node build.mjs >> "${shots}/npm.log" 2>&1)
          (cd "${R}" && python3 -m http.server 8893 --bind 127.0.0.1 > "${shots}/static.log" 2>&1 &)
          GENOME_CANVAS_STATE_DIR="${RUNNER_TEMP}/gc-state" python3 "${R}/genome-canvas/server.py" --host 127.0.0.1 --port 8000 > "${shots}/gc.log" 2>&1 &
          python3 "${R}/workbench/server.py" --state "${RUNNER_TEMP}/wb-state" --interval 3600 > "${shots}/workbench.log" 2>&1 &
          python3 "${R}/gateway/gateway.py" --listen 127.0.0.1 --port 8892 > "${shots}/gateway.log" 2>&1 &
          for attempt in $(seq 1 30); do
            curl -fs http://127.0.0.1:8892/workbench/ > /dev/null && curl -fs http://127.0.0.1:8892/hub/static/workbench.css > /dev/null && break
            sleep 1
          done
          curl -fsS -o /dev/null -w "workbench page %{http_code}\n" http://127.0.0.1:8892/workbench/
          d=edu.stanford.quertermouslab.omicsworkbench; p=OmicsWorkbenchConnection
          defaults write $d ${p}Host 127.0.0.1; defaults write $d ${p}Port -int 8892; defaults write $d ${p}Scheme http
          defaults write $d ${p}Path /; defaults write $d ${p}UseTunnel -bool false
          env OMICS_WORKBENCH_SNAPSHOT_DIR="${shots}" \
            "dist/preview/${{ matrix.bundle }}/Contents/MacOS/${{ matrix.binary }}" > "${shots}/app.log" 2>&1 &
          for attempt in $(seq 1 60); do
            [[ -f "${shots}/window-dark.png" ]] && break
            sleep 2
          done
          ls -la "${shots}"
          grep "page theme:" "${shots}/app.log"
          # "page theme: <window> <path> <page data-theme> <bridge> <body background>"
          grep -q "page theme: light /workbench/ light true" "${shots}/app.log"
          grep -q "page theme: dark /workbench/ dark true" "${shots}/app.log"
      - name: Capture Genome Canvas connected to a server
        if: matrix.app == 'genome-canvas'
        working-directory: ${{ matrix.dir }}
        shell: bash
        run: |
          # Server mode shows what This Mac hides (workspaces, Shared tracks); a test server on the runner stands
          # in for the lab server, and the app then opens the Shared tracks dialog from its sidebar card.
          shots="${RUNNER_TEMP}/shots/server"
          mkdir -p "${shots}" "${RUNNER_TEMP}/gc-state"
          GENOME_CANVAS_STATE_DIR="${RUNNER_TEMP}/gc-state" GENOME_DATA_ROOTS="${GITHUB_WORKSPACE}/genome-canvas/tests" \
            python3 "${GITHUB_WORKSPACE}/genome-canvas/server.py" --host 127.0.0.1 --port 8000 > "${shots}/server.log" 2>&1 &
          for attempt in $(seq 1 30); do
            curl -fs http://127.0.0.1:8000/ > /dev/null && break
            sleep 1
          done
          env GENOME_CANVAS_SNAPSHOT_DIR="${shots}" GENOME_CANVAS_SNAPSHOT_SERVER="http://127.0.0.1:8000/" \
            "dist/preview/${{ matrix.bundle }}/Contents/MacOS/${{ matrix.binary }}" > "${shots}/app.log" 2>&1 &
          for attempt in $(seq 1 60); do
            [[ -f "${shots}/shared-tracks-dark.png" ]] && break
            sleep 2
          done
          ls -la "${shots}"
          test -f "${shots}/window-light.png"
          test -f "${shots}/shared-tracks-dark.png"
      - name: Launch Genome Canvas from a genomecanvas:// link
        if: matrix.app == 'genome-canvas'
        working-directory: ${{ matrix.dir }}
        shell: bash
        run: |
          # The link starts the app (as Omics Canvas does): it must open at the linked region with the highlight.
          shots="${RUNNER_TEMP}/shots/link"
          mkdir -p "${shots}"
          launchctl setenv GENOME_CANVAS_SNAPSHOT_DIR "${shots}"
          open -a "${PWD}/dist/preview/${{ matrix.bundle }}" \
            "genomecanvas://open?locus=chr8:127,700,001-127,760,000&genome=hg38&highlight=chr8:127,735,001-127,736,000"
          for attempt in $(seq 1 60); do
            [[ -f "${shots}/window-dark.png" ]] && break
            sleep 2
          done
          launchctl unsetenv GENOME_CANVAS_SNAPSHOT_DIR
          ls -la "${shots}"
          test -f "${shots}/window-light.png"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-ui-preview-${{ matrix.app }}
          path: ${{ runner.temp }}/shots
